services:
  api:
    build:
      context: ../backend
    container_name: starscout-api
    restart: unless-stopped
    environment:
      STARSCOUT_APP_NAME: ${STARSCOUT_APP_NAME:-StarScout API}
      STARSCOUT_APP_VERSION: ${STARSCOUT_APP_VERSION:-0.1.0}
      STARSCOUT_ENABLE_DOCS: ${STARSCOUT_ENABLE_DOCS:-false}
      STARSCOUT_DATABASE_URL: ${STARSCOUT_DATABASE_URL}
      STARSCOUT_MONGODB_URL: ${STARSCOUT_MONGODB_URL:-mongodb://mongo:27017}
      STARSCOUT_MONGODB_DATABASE: ${STARSCOUT_MONGODB_DATABASE:-fake_stars}
      STARSCOUT_ANALYZED_THROUGH: ${STARSCOUT_ANALYZED_THROUGH:-2025-01-01}
      STARSCOUT_GITHUB_TOKEN: ${STARSCOUT_GITHUB_TOKEN:-}
      STARSCOUT_GITHUB_REPO_CACHE_TTL_SECONDS: ${STARSCOUT_GITHUB_REPO_CACHE_TTL_SECONDS:-3600}
      STARSCOUT_REPO_INTEGRITY_RATE_LIMIT_PER_MINUTE: ${STARSCOUT_REPO_INTEGRITY_RATE_LIMIT_PER_MINUTE:-60}
      STARSCOUT_CORS_ALLOW_ORIGIN_REGEX: ${STARSCOUT_CORS_ALLOW_ORIGIN_REGEX:-^(https://github\.com|chrome-extension://.+|moz-extension://.+)$}
      STARSCOUT_API_CACHE_MAX_AGE_SECONDS: ${STARSCOUT_API_CACHE_MAX_AGE_SECONDS:-300}
    command:
      - uv
      - run
      - --no-dev
      - uvicorn
      - starscout_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --log-level
      - ${STARSCOUT_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: starscout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starscout}
      POSTGRES_USER: ${POSTGRES_USER:-starscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starscout_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - starscout-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8-noble
    container_name: starscout-mongo
    restart: unless-stopped
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_APP_DATABASE: ${STARSCOUT_MONGODB_DATABASE:-fake_stars}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - starscout-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_APP_USERNAME}\" --password \"$${MONGO_APP_PASSWORD}\" --authenticationDatabase \"$${MONGO_APP_DATABASE}\" \"$${MONGO_APP_DATABASE}\" --eval \"db.runCommand({ ping: 1 }).ok\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  starscout-postgres-data:
  starscout-mongo-data:
