services:
  postgres:
    image: postgres:17-alpine
    container_name: starscout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starscout}
      POSTGRES_USER: ${POSTGRES_USER:-starscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starscout_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - starscout-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8-noble
    container_name: starscout-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - starscout-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  starscout-postgres-data:
  starscout-mongo-data:
